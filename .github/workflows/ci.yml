name: CI

# Runs on every push to main and on every pull request.
#
# Security (BLUEPRINT section 11.8, public repository):
# - Uses `pull_request`, never `pull_request_target`, so code from forks runs without
#   access to secrets. This workflow needs no secrets at all.
# - The token is read-only.
# - Third-party actions are pinned to full commit SHAs, not movable tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------- secrets ----
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

  # ------------------------------------------------------------- backend ----
  backend:
    name: Backend (lint, types, tests with MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway value for a database that exists only for this job, on this runner.
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: officemates
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: Create restricted database accounts
        working-directory: .
        run: |
          # Fresh random passwords for every run; masked in the logs.
          for name in APP MIGRATOR READONLY; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "MYSQL_${name}_PASSWORD=$value" >> "$GITHUB_ENV"
            export "MYSQL_${name}_PASSWORD=$value"
          done
          MYSQL_ROOT_PASSWORD=ci-only-root-password MYSQL_HOST=127.0.0.1 MYSQL_PORT=3306 \
            sh infra/docker/mysql/10-users.sh

      - name: Tests (unit + MySQL integration)
        run: |
          export OM_TEST_DATABASE_URL="mysql+asyncmy://app_rw:${MYSQL_APP_PASSWORD}@127.0.0.1:3306/officemates_test"
          export OM_TEST_DATABASE_MIGRATION_URL="mysql+asyncmy://migrator:${MYSQL_MIGRATOR_PASSWORD}@127.0.0.1:3306/officemates_test"
          # CI=true makes the integration tests fail (not skip) if MySQL is unreachable.
          uv run pytest -ra

  # ----------------------------------------------------------------- web ----
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ------------------------------------------------------------ contract ----
  contract:
    name: API contract (generated client is up to date)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate OpenAPI schema and TypeScript types
        run: |
          (cd apps/backend && uv sync --frozen --no-dev \
            && uv run --no-dev python -m officemates.scripts.export_openapi ../web/lib/api/openapi.json)
          (cd apps/web && npm ci && npm run gen:api)

      - name: Fail if the committed files are stale
        run: |
          if ! git diff --exit-code -- apps/web/lib/api; then
            echo "::error::Backend API changed but apps/web/lib/api was not regenerated. See README (regenerate the typed client)."
            exit 1
          fi

  # --------------------------------------------------------------- stack ----
  stack:
    name: Docker stack (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env with random passwords
        run: |
          while IFS= read -r line; do
            case "$line" in
              *=CHANGE_ME) echo "${line%%=*}=$(openssl rand -hex 16)" ;;
              *) echo "$line" ;;
            esac
          done < .env.example > .env

      - name: Build images and start everything
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: |
          set -eu
          echo "--- API readiness (must list mysql and redis as ok)"
          ready="$(curl -fsS http://127.0.0.1:8000/readyz)"
          echo "$ready"
          echo "$ready" | grep -q '"status":"ok","checks"'
          echo "$ready" | grep -q '"name":"mysql","status":"ok"'
          echo "$ready" | grep -q '"name":"redis","status":"ok"'

          echo "--- Web page reports the backend as operational"
          curl -fsS http://127.0.0.1:3000/ | grep -q "Operational"

          echo "--- Worker executes a task through Redis"
          docker compose exec -T api python -c \
            "from officemates.workers.tasks import ping; assert ping.delay().get(timeout=30) == 'pong'"

          echo "--- Containers do not run as root"
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"

      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=80

      - name: Stop
        if: always()
        run: docker compose down -v
